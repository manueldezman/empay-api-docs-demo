openapi: 3.0.3

info:
  title: EmPay HRMS API Demo
  version: '1.0'
  description: Simulated API environment for trying the attendance workflow.

servers:
  - url: https://empay-api-docs-demo.vercel.app

paths:
  /api/attendance/my:
    get:
      summary: Get monthly attendance
      description: Returns fictional attendance records for the selected month and year.
      operationId: getDemoAttendance
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          description: Month to include in the simulated response. Defaults to the current month.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          description: Year to include in the simulated response. Defaults to the current year.
          schema:
            type: integer
            minimum: 2000
            maximum: 9999
      responses:
        '200':
          description: Attendance fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
              example:
                success: true
                message: Attendance fetched
                data:
                  - id: 1
                    employee_id: 1
                    date: '2025-06-01'
                    check_in: '09:00:00'
                    check_out: '17:00:00'
                    accumulated_minutes: 0
                    duration_minutes: 480
                    status: present
                    created_at: '2025-06-01T18:00:00.000Z'
                    full_name: Ada Okafor
                    email: ada@example.com
                    department: Engineering
                    designation: Software Engineer
                    profile_pic: https://cdn.example.com/avatars/ada.jpg
        '401':
          description: Missing or invalid demo bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Token not provided
                  value:
                    success: false
                    message: Access denied. No token provided.
                invalidToken:
                  summary: Token is incorrect
                  value:
                    success: false
                    message: Invalid token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Public token for the simulated attendance request.
      x-default: empay_portfolio_demo

  schemas:
    AttendanceResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'

    AttendanceRecord:
      type: object
      required:
        - id
        - employee_id
        - date
        - accumulated_minutes
        - status
        - created_at
        - full_name
        - email
        - department
        - designation
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        date:
          type: string
          format: date
        check_in:
          type: string
          nullable: true
        check_out:
          type: string
          nullable: true
        accumulated_minutes:
          type: integer
        duration_minutes:
          type: integer
          nullable: true
        status:
          type: string
          enum: [present, absent, half_day, on_leave]
        created_at:
          type: string
          format: date-time
        full_name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        designation:
          type: string
        profile_pic:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
