openapi: 3.0.3

info:
  title: EmPay HRMS API Demo
  version: '1.0'
  description: Simulated API environment for trying the attendance workflow.

servers:
  - url: https://empay-api-docs-demo.vercel.app

paths:
  /api/attendance/my:
    get:
      tags:
        - Attendance
      summary: Get monthly attendance
      description: Returns fictional attendance records for the authenticated employee.
      operationId: getDemoAttendance
      security:
        - employeeAuth: []
      parameters:
        - name: month
          in: query
          description: Month to include in the simulated response. Defaults to 8.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          description: Year to include in the simulated response. Defaults to 2026.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Attendance fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
              example:
                success: true
                data:
                  - id: 1
                    employee_id: 4
                    full_name: Ada Okafor
                    department: Engineering
                    date: '2026-08-03'
                    check_in: '08:52:00'
                    check_out: '17:08:00'
                    status: present
                    work_hours: 8.27
                  - id: 2
                    employee_id: 4
                    full_name: Ada Okafor
                    department: Engineering
                    date: '2026-08-04'
                    check_in: '09:03:00'
                    check_out: '17:15:00'
                    status: present
                    work_hours: 8.2
        '400':
          description: The month or year is outside the supported range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Month must be 1-12 and year must be 2000-2100.
        '401':
          description: Missing or invalid demo bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Token not provided
                  value:
                    success: false
                    message: Access denied. No token provided.
                invalidToken:
                  summary: Token is incorrect
                  value:
                    success: false
                    message: Invalid token.

components:
  securitySchemes:
    employeeAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Simulated employee token for this portfolio demonstration.
      x-default: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjQsInJvbGUiOiJlbXBsb3llZSIsImlzcyI6ImVtcGF5LWRlbW8iLCJhdWQiOiJlbXBheS1hcGkifQ.eeZsZ8ubtiGiqnaNKZF0zXgR3hZBEgQ8MQN17l3Z6G9IP4Ku3_yWUaNHeO4GDMbUfsmv-3f9mKv2g8YsqN8aJAgSBQdXdbrUjGIEDPEaoPFolkl28f2V3eH2PyHJAuwgbZ9Tec1OmA-f88d8ELD4Aoe5Gji_q-WDJ3SXcW4l36RiP9ito7AhPRZx9nCgYrqCblACwyMKJfaukLVQR_icGoxJrWxZN1Yufz9sLTJMuy6NjG3oaRhHFNnT9go3ZpHlowkhgGZWajnUCYbpYrCaBFhVO_kyzmvyJ7BOxO7UlAevM2GMBx57Hd106CkCFC84n5Qve4JnbUkuX8PfoYwKng

  schemas:
    AttendanceResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'

    AttendanceRecord:
      type: object
      required:
        - id
        - employee_id
        - full_name
        - department
        - date
        - status
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        full_name:
          type: string
        department:
          type: string
        date:
          type: string
          format: date
        check_in:
          type: string
          nullable: true
        check_out:
          type: string
          nullable: true
        status:
          type: string
          enum: [present, absent, half_day, on_leave]
        work_hours:
          type: number
          nullable: true

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
