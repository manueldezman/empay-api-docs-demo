<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">EmPay HRMS API system architecture</title>
  <desc id="desc">Admin and HR officers, employees, and payroll officers use web applications or external integrations that communicate with the EmPay HRMS API. The API uses supporting email, notification, and PDF services and connects to PostgreSQL, Cloudinary, and an SMTP provider.</desc>
  <defs>
    <style>
      .canvas{fill:#111315}.section{fill:#1a1a1a;stroke:#3b3f42;stroke-width:2}.api{fill:#271914;stroke:#ff6038;stroke-width:2}.item{fill:#202326;stroke:#3b3f42;stroke-width:1.5}.service{fill:#1a1a1a;stroke:#ff6038;stroke-width:1.8}.iconbg{fill:#381d16}.icon{fill:none;stroke:#ff6038;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#ff6038;stroke-width:3;marker-start:url(#back);marker-end:url(#next)}.support{fill:none;stroke:#6f767b;stroke-width:2.5;stroke-dasharray:6 6}.heading{fill:#ffffff;font:700 25px Inter,Arial,sans-serif}.section-title{fill:#ff6038;font:700 12px Inter,Arial,sans-serif;letter-spacing:1px}.title{fill:#ffffff;font:700 16px Inter,Arial,sans-serif}.body{fill:#b7bdc2;font:500 13px Inter,Arial,sans-serif}.small{fill:#b7bdc2;font:600 12px Inter,Arial,sans-serif}
    </style>
    <marker id="next" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l9 5-9 5z" fill="#ff6038"/></marker>
    <marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 0 0 5l9 5z" fill="#ff6038"/></marker>
  </defs>

  <rect class="canvas" width="1200" height="720" rx="28"/>
  <text class="heading" x="38" y="48">EmPay HRMS API architecture</text>
  <text class="body" x="38" y="73">How people and applications interact with the API and its supporting systems.</text>

  <text class="section-title" x="505" y="112">SUPPORTING SERVICES</text>
